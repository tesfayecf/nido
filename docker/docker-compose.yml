services:
  app:
    container_name: nido
    image: ghcr.io/tesfayecf/nido:latest
    restart: unless-stopped
    env_file: 'nido.env'
    environment:
      AUTO_MIGRATE: "true"
      MIGRATION_STRATEGY: safe-auto
      NIDO_BACKUP_DIR: /app/backups
    volumes:
      - ./data:/data
      - ./backups:/app/backups
    network_mode: bridge
    ports:
      - "4000:3000"
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1024M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:18080/api/v1/health/ready"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s
    labels:
      - "com.example.description=nido"
      - "com.example.version=0.1.0"
    read_only: true
    stop_signal: SIGTERM
    stop_grace_period: 15s
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
