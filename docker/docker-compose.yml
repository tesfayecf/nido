services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        VITE_API_ORIGIN: ""
    environment:
      NIDO_HTTP_ADDR: 127.0.0.1:18080
      NIDO_DATABASE_PATH: /data/nido.db
      NIDO_BOOTSTRAP_ADMIN_EMAIL: admin@local
      NIDO_BOOTSTRAP_ADMIN_NAME: Local Admin
      NIDO_BOOTSTRAP_ADMIN_PASSWORD: dev-password
      NIDO_AUTH_SESSION_TTL: 24h
      TMPDIR: /tmp
    ports:
      - "3000:80"
    volumes:
      - nido_data:/data
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    stop_signal: SIGTERM
    stop_grace_period: 15s

volumes:
  nido_data:
